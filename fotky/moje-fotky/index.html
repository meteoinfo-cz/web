    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moje fotky - MeteoInfo</title>
<link rel="apple-touch-icon" sizes="180x180" href="../../apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="48x48" href="../../favicon-48x48.png">
<link rel="icon" type="image/png" sizes="32x32" href="../../favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../../favicon-16x16.png">

<style>
        :root {
            --bg-body: #0b0f19;
            --bg-card: #111827;
            --bg-header: #1e293b;
            --bg-inner: #0f172a;
            --bg-inner-forecast: #1f2937;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --text-accent: #38bdf8;
            --border-color: #1f2937;
            --border-inner: #334155;
            --text-dark-only: #ffffff;
        }

        [data-theme="light"] {
            --bg-body: #f1f5f9;
            --bg-card: #ffffff;
            --bg-header: #cbd5e1;
            --bg-inner: #cbd5e1;
            --bg-inner-forecast: #94a3b8;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --text-accent: #0284c7;
            --border-color: #cbd5e1;
            --border-inner: #cbd5e1;
            --text-dark-only: #0f172a;
        }

        body { 
    font-family: Arial, sans-serif; 
    background: var(--bg-body); 
    color: var(--text-main); 
    padding: 20px; 
    box-sizing: border-box; 
    transition: background 0.2s, color 0.2s; 
}

/* ROZŠÍŘENÍ: Nastaveno na přesných 1250px */
.container { 
    max-width: 1250px; 
    margin: 0 auto; 
    width: 100%;
}

header { 
    position: relative; 
    display: flex; 
    justify-content: space-between; 
    padding: 15px; 
    background: var(--bg-header); 
    border-radius: 12px; 
    align-items: center; 
}

.header-left { 
    display: flex; 
    flex-direction: column; 
    gap: 4px; 
    min-width: 250px; 
    z-index: 2; 
}

.header-right { 
    display: flex; 
    align-items: center; 
    gap: 20px; 
    min-width: 320px; 
    justify-content: flex-end; 
    z-index: 2; 
}

.header-center-title {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    margin: 0;
    font-size: 2.2rem;
    font-weight: bold;
    color: var(--text-accent);
    letter-spacing: 1px;
    text-shadow: 0px 2px 4px rgba(0,0,0,0.5);
    z-index: 1;
    white-space: nowrap;
}

/* Mřížka – levý box drží stabilních 350px, pravý (1fr) se přizpůsobí šířce 1250px */
.grid-top { 
    display: grid; 
    grid-template-columns: 350px 1fr; 
    gap: 20px; 
    margin-top: 20px; 
    justify-content: space-between; 
}

@media (max-width: 1200px) { 
    .grid-top { 
        grid-template-columns: 1fr; 
        justify-content: center; 
    } 
}

.card { 
    background: var(--bg-card); 
    border-radius: 12px; 
    padding: 20px; 
    border: 1px solid var(--border-color); 
    height: auto; 
    display: flex; 
    flex-direction: column; 
    overflow: hidden; 
    max-width: 100%; 
    box-sizing: border-box; 
}

.asistent-box { 
    padding: 15px; 
    border-radius: 8px; 
    margin-top: 0; 
    border-left: 4px solid #64748b; 
    background: var(--bg-inner); 
}

.psi-box { 
    padding: 15px; 
    border-radius: 8px; 
    margin-top: 15px; 
    background: var(--bg-inner); 
    border-left: 4px solid #cbd5e1; 
}

.meteo-details-box { 
    display: flex; 
    justify-content: space-around; 
    background: var(--bg-inner); 
    padding: 12px; 
    border-radius: 8px; 
    margin-top: 15px; 
    border: 1px solid var(--border-inner); 
    flex-wrap: wrap; 
    gap: 10px; 
}

.meteo-detail-polozka { 
    text-align: center; 
    font-size: 0.85rem; 
    color: var(--text-main); 
    min-width: 65px; 
}

.meteo-detail-hodnota { 
    display: block; 
    font-weight: bold; 
    color: var(--text-accent); 
    margin-top: 2px; 
    font-size: 0.95rem; 
}

.meteo-srazky, .meteo-vitr { 
    cursor: pointer; 
    user-select: none; 
}

.hourly-scroll-container { 
    display: flex; 
    justify-content: flex-start; 
    gap: 10px; 
    overflow-x: auto !important; 
    padding-bottom: 12px; 
    margin-top: 10px; 
    margin-bottom: 5px; 
    scrollbar-width: thin; 
    flex-wrap: nowrap !important; 
    width: 100%; 
    box-sizing: border-box; 
}

.hourly-item { 
    background: var(--bg-inner-forecast); 
    border: 1px solid var(--border-inner); 
    border-radius: 10px; 
    padding: 8px; 
    text-align: center; 
    min-width: 85px; 
    max-width: 85px; 
    flex-shrink: 0 !important; 
    display: inline-block; 
    box-sizing: border-box; 
}

.hourly-time { 
    font-size: 0.8rem; 
    color: var(--text-main) !important; 
    font-weight: bold; 
}

.hourly-icon { 
    width: 52px; 
    height: 52px; 
    margin: 4px 0; 
}

.hourly-temp { 
    font-size: 0.9rem; 
    font-weight: bold; 
}

.chart-container { 
    position: relative; 
    height: 220px; 
    width: 100%; 
    margin-top: 10px; 
}

.chart-toggle-btn { 
    background: var(--bg-inner); 
    border: 1px solid var(--border-inner); 
    color: var(--text-main); 
    padding: 6px 12px; 
    border-radius: 6px; 
    cursor: pointer; 
    font-size: 0.85rem; 
    transition: all 0.2s; 
}

.chart-toggle-btn.active { 
    background: var(--text-accent); 
    color: #ffffff; 
    border-color: var(--text-accent); 
    font-weight: bold; 
}

.chart-btn-group { 
    display: flex; 
    gap: 8px; 
    margin-bottom: 10px; 
}

.forecast-grid-scroll { 
    display: flex; 
    flex-direction: column; 
    gap: 8px; 
    width: 100%; 
}

.forecast-day-row { 
    display: flex; 
    justify-content: space-between; 
    align-items: center; 
    background: var(--bg-inner); 
    padding: 10px 15px; 
    border-radius: 8px; 
    border: 1px solid var(--border-inner); 
    font-size: 0.9rem; 
}

.forecast-date { 
    color: var(--text-muted); 
    min-width: 90px; 
}

.forecast-subdata { 
    font-size: 0.8rem; 
    color: var(--text-muted); 
    display: flex; 
    gap: 15px; 
}

.weather-icon { 
    width: 28px; 
    height: 28px; 
}

.modal-overlay { 
    position: fixed; 
    top: 0; 
    left: 0; 
    width: 100%; 
    height: 100%; 
    background: rgba(0,0,0,0.7); 
    display: none; 
    justify-content: center; 
    align-items: center; 
    z-index: 1000; 
}

.modal-overlay.active { 
    display: flex; 
}

.modal-box { 
    background: var(--bg-card); 
    padding: 25px; 
    border-radius: 12px; 
    border: 1px solid var(--border-color); 
    max-width: 500px; 
    width: 90%; 
    position: relative; 
    color: var(--text-main); 
}

.close-btn { 
    background: #ef4444; 
    color: white; 
    border: none; 
    padding: 8px 16px; 
    border-radius: 6px; 
    cursor: pointer; 
    font-weight: bold; 
    display: block; 
    margin: 15px auto 0 auto; 
}

.header-btn { 
    background: var(--bg-inner); 
    border: 1px solid var(--border-inner); 
    color: var(--text-main); 
    padding: 6px 12px; 
    border-radius: 6px; 
    cursor: pointer; 
    display: flex; 
    align-items: center; 
    gap: 6px; 
    font-size: 0.85rem; 
}

.header-btn:hover { 
    border-color: var(--text-accent); 
}

/* --- ROZTAŽENÍ HORNÍCH PRVKŮ NA PLNOU VÝŠKU (44px) --- */
@media (max-width: 900px) {
  #main-header {
    height: auto !important;
    min-height: 44px !important;
    padding: 0 !important;
    background: transparent !important;
    margin-bottom: 15px !important;
    width: calc(100% + 28px) !important;
    margin-left: -14px !important;
    margin-right: -14px !important;
    box-sizing: border-box !important;
  }

  #main-header > div {
    display: flex !important;
    flex-direction: row !important;
    flex-wrap: wrap !important;
    align-items: center !important;
    justify-content: space-between !important;
    gap: 0px !important;
    padding: 0px !important;
    width: 100% !important;
    background-color: var(--bg-card, #0d1117) !important;
    border-radius: 0px !important;
    box-sizing: border-box !important;
    overflow: hidden !important;
  }

  /* 1. Čas a datum – plná výška 44px */
  #main-header > div > div:first-child {
    display: flex !important;
    flex: 1.2 1 0% !important;
    height: 44px !important;
    padding: 0 4px !important;
    font-size: 12px !important;
    background-color: var(--bg-inner, #21262d) !important;
    border: 0px solid var(--border-inner, #30363d) !important;
    border-radius: 0px !important;
    align-items: center !important;
    justify-content: center !important;
    order: 1 !important;
    white-space: nowrap !important;
    color: var(--text-main, #ffffff) !important;
    box-sizing: border-box !important;
  }
  #main-header > div > div:first-child span {
    font-size: 14px !important;
  }

  /* 2. O webu – plná výška 44px */
  #main-header > div > a[href*="o-webu"] {
    display: flex !important;
    flex: 1 1 0 !important;
    height: 44px !important;
    padding: 0 !important;
    font-size: 13px !important;
    font-weight: 600 !important;
    background-color: var(--bg-inner, #21262d) !important;
    border: 0px solid var(--border-inner, #30363d) !important;
    border-radius: 0px !important;
    align-items: center !important;
    justify-content: center !important;
    order: 2 !important;
    color: var(--text-main, #c9d1d9) !important;
    text-decoration: none !important;
    white-space: nowrap !important;
    box-sizing: border-box !important;
  }

  /* 3. Meteoradar – plná výška 44px */
  #main-header > div > a[href*="meteoradar"] {
    display: flex !important;
    flex: 1 1 0 !important;
    height: 44px !important;
    padding: 0 !important;
    font-size: 13px !important;
    font-weight: 600 !important;
    background-color: var(--bg-inner, #21262d) !important;
    border: 0px solid var(--border-inner, #30363d) !important;
    border-radius: 0px !important;
    align-items: center !important;
    justify-content: center !important;
    order: 3 !important;
    color: var(--text-main, #c9d1d9) !important;
    text-decoration: none !important;
    white-space: nowrap !important;
    box-sizing: border-box !important;
  }

  /* 4. Hamburger tlačítko (☰) vpravo – plná výška 44px */
  #main-header > div::after {
    content: "☰" !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    flex: 0 0 44px !important;
    height: 44px !important;
    background-color: var(--bg-inner, #21262d) !important;
    color: var(--text-accent, #38bdf8) !important;
    border: 0px solid var(--border-inner, #30363d) !important;
    border-radius: 0px !important;
    font-size: 16px !important;
    font-weight: bold !important;
    cursor: pointer !important;
    box-sizing: border-box !important;
    order: 4 !important;
    transition: background-color 0.2s ease !important;
  }

  #main-header > div:hover::after,
  #main-header > div::after:hover {
    background-color: #30363d !important;
  }

  /* Skrytí ostatních ve výchozím stavu */
  #main-header > div > a:not([href*="o-webu"]):not([href*="meteoradar"]),
  #main-header > div > select,
  #main-header > div > button#theme-button {
    display: none !important;
  }

  /* --- PO ROZKLIKNUTÍ (.open) --- */
  #main-header.open > div {
    display: flex !important;
    flex-wrap: wrap !important;
  }

  #main-header.open > div > div:first-child,
  #main-header.open > div > a[href*="o-webu"],
  #main-header.open > div > a[href*="meteoradar"] {
    display: flex !important;
    height: 44px !important;
  }

  #main-header.open > div::after {
    content: "✕" !important;
    color: #ef4444 !important;
    height: 44px !important;
  }

  /* Běžná tlačítka v rozbaleném menu (výška 44px) */
  #main-header.open > div > a:not([href*="o-webu"]):not([href*="meteoradar"]) {
    display: flex !important;
    flex: 0 0 50% !important;
    width: 50% !important;
    height: 44px !important;
    justify-content: center !important;
    align-items: center !important;
    border-radius: 0px !important;
    border-top: 1px solid var(--border-inner, #30363d) !important;
    border-right: 1px solid var(--border-inner, #30363d) !important;
    background-color: var(--bg-inner, #21262d) !important;
    font-size: 12px !important;
    color: var(--text-main, #c9d1d9) !important;
    text-decoration: none !important;
    box-sizing: border-box !important;
    order: 10 !important;
  }

  /* Tlačítko tématu vlevo (výška 44px) */
  #main-header.open > div > button#theme-button {
    display: flex !important;
    flex: 0 0 50% !important;
    width: 50% !important;
    height: 44px !important;
    justify-content: center !important;
    align-items: center !important;
    border-radius: 0px !important;
    border-top: 1px solid var(--border-inner, #30363d) !important;
    border-right: 1px solid var(--border-inner, #30363d) !important;
    background-color: var(--bg-inner, #21262d) !important;
    box-sizing: border-box !important;
    order: 11 !important;
  }

  /* Úplné skrytí selectu Více na mobilu */
  #main-header.open > div > select {
    display: none !important;
  }

  html, body {    
    zoom: 0.90 !important;  }
}

/* --- OPRAVA A VYČIŠTĚNÍ PRO OBECNÉ TŘÍDY --- */
.o-webu-btn {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 0.85rem;
    cursor: pointer;
    padding: 0;
    text-decoration: underline;
}
.o-webu-btn:hover {
    color: var(--text-accent);
}

.radar-box {
    width: 100%;
    margin: 10px auto;
    background: #111622;
    padding: 10px;
    border-radius: 8px;
    color: var(--text-main);
    border: 1px solid var(--border-inner);
    box-sizing: border-box;
}

@media (max-width: 900px) {
  header {
    flex-direction: column !important;
    align-items: center !important;
    gap: 15px !important;
    padding: 15px !important;
  }
    .mobilni-sledovat-kontejner {
        position: static !important;
        display: flex !important;
        justify-content: center !important;
        align-items: center !important;
        width: 100% !important;
        margin-top: 10px !important;
    
    }

  .header-left, .header-right {
    min-width: unset !important;
    width: 100% !important;
    justify-content: center !important;
    align-items: center !important;
    text-align: center !important;
  }
  .header-center-title {
    position: static !important;
    transform: none !important;
    margin: 10px 0 !important;
    font-size: 1.8rem !important;
  }
  .header-right {
    flex-direction: row !important;
    flex-wrap: wrap !important;
    gap: 10px !important;
  }
  .forecast-grid-scroll, .hourly-scroll-container {
    display: flex !important;
    overflow-x: auto !important;
    white-space: nowrap !important;
    width: 100% !important;
  }
}
/* Kontejner pod přepínačem měsíce */
.follow-container-header {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 8px;
    position: absolute;
    right: 15px;
    top: 45px;
}
/* Stylování informačního kontejneru */
.info-tooltip-container {
    position: relative;
    display: inline-flex;
    align-items: center;
    margin-left: 8px;
    cursor: pointer;
}

/* Vzhled kroužku s "i" */
.info-box {
    width: 18px;
    height: 18px;
    background-color: #374151;
    color: #9ca3af;
    border-radius: 50%;
    text-align: center;
    font-size: 12px;
    font-weight: bold;
    line-height: 18px;
    font-family: sans-serif;
    border: 1px solid #4b5563;
    transition: background 0.2s, color 0.2s;
}

.info-tooltip-container {
    position: relative; /* Zajistí správné ukotvení */
}

.tooltip-text {
    visibility: hidden;
    width: 260px;
    background-color: #000000 !important;
    color: #ffffff !important;
    text-align: left;
    border-radius: 8px;
    padding: 12px;
    position: absolute;
    z-index: 2147483647 !important; /* Maximální možný z-index v prohlížeči */
    top: 100% !important;           /* Zkusíme ji dát dolů pod ikonku, ať neutíká pod hlavičku */
    right: 0;
    font-size: 12px;
    line-height: 1.4;
    border: 2px solid #ffffff !important;
    box-shadow: 0 15px 35px rgba(0,0,0,0.9) !important;
    opacity: 0;
    transition: opacity 0.2s, visibility 0.2s;
}

.info-tooltip-container:hover .tooltip-text {
    visibility: visible;
    opacity: 1;
}


/* Tlačítko Sledovat */
.btn-follow {
    background-color: #2563eb;
    color: white;
    border: none;
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s ease;
}

.btn-follow:hover { 
    background-color: #1d4ed8; 
}

/* Aktivní stav po kliknutí (Sledováno) */
.btn-follow.active {
    background-color: #1e293b;
    color: #94a3b8;
    border: 1px solid #334155;
}

/* Čtvereček [i] */
.info-tooltip-container {
    position: relative;
    display: inline-block;
}

.info-box {
    width: 20px;
    height: 20px;
    background-color: #1e293b;
    color: #94a3b8;
    border: 1px solid #334155;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: monospace;
    font-weight: bold;
    font-size: 12px;
    cursor: help;
    transition: all 0.2s;
}
.info-box:hover {
    background-color: #334155;
    color: white;
}

/* Vyskakovací bublina s textem */
.tooltip-text {
    visibility: hidden;
    width: 240px;
    background-color: #0f172a;
    color: #e2e8f0;
    text-align: left;
    border: 1px solid #334155;
    border-radius: 6px;
    padding: 10px;
    font-size: 12px;
    line-height: 1.4;
    position: absolute;
    top: 125%;
    right: 0;
    z-index: 99;
    opacity: 0;
    transition: opacity 0.3s;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.7);
}

/* Zobrazení bubliny při najetí myší na [i] */
.info-tooltip-container:hover .tooltip-text {
    visibility: visible;
    opacity: 1;
}

/* =======================================================
   FINÁLNÍ OPRAVA PRO ČERNÝ (TMAVÝ) MOTIV METEO DENÍKU
   ======================================================= */

/* 1. TEXTY V PRAVÉM SLOUPCI A HLAVNÍ NADPISY ZBĚLAJÍ */
[data-theme="dark"] #okno-denik h2,
[data-theme="dark"] #okno-denik h3,
[data-theme="dark"] #okno-denik header,
[data-theme="dark"] #okno-denik .modal-title,
[data-theme="dark"] #denik-text-jevu,
[data-theme="dark"] #denik-text-jevu p,
[data-theme="dark"] #denik-text-jevu strong,
[data-theme="dark"] #denik-vychozi-text p,
.dark-mode #okno-denik h2,
.dark-mode #okno-denik h3,
.dark-mode #okno-denik header,
.dark-mode #okno-denik .modal-title,
.dark-mode #denik-text-jevu,
.dark-mode #denik-text-jevu p,
.dark-mode #okno-denik p,
.dark-mode #denik-text-jevu strong,
.dark-mode #denik-vychozi-text p,
.dark #okno-denik h2,
.dark #okno-denik h3,
.dark #okno-denik header,
.dark #okno-denik .modal-title,
.dark #denik-text-jevu,
.dark #denik-text-jevu p,
.dark #denik-text-jevu strong,
.dark #denik-vychozi-text p {
    color: #ffffff !important;
}

/* 2. TLAČÍTKA V LEVÉM SLOUPCI ZČERNAJÍ A DOSTANOU BÍLÉ PÍSMO */
[data-theme="dark"] #okno-denik .denik-kat-btn,
.dark-mode #okno-denik .denik-kat-btn,
.dark #okno-denik .denik-kat-btn {
    color: #ffffff !important;
    background-color: #1f2937 !important; /* Tmavě šedé/černé pozadí */
    border: 1px solid #374151 !important; /* Tmavý okraj */

function toggleTheme() {
    const btn = document.getElementById('theme-button');
    const header = document.getElementById('main-header');
    const timeEl = document.getElementById('live-time');
    const dateEl = document.getElementById('live-date');

    if (currentTheme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'light');
        if (btn) btn.innerText = "☀️";
        currentTheme = "light";
        localStorage.setItem('theme', 'light');

        if (header) {
            header.style.backgroundColor = '#ffffff';
            header.style.borderBottomColor = '#d0d7de';
        }
        if (timeEl) timeEl.style.color = '#000000';
        if (dateEl) dateEl.style.color = '#333333';
    } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        if (btn) btn.innerText = "🌙";
        currentTheme = "dark";
        localStorage.setItem('theme', 'dark');

        if (header) {
            header.style.backgroundColor = '#0d1117';
            header.style.borderBottomColor = '#21262d';
        }
        if (timeEl) timeEl.style.color = '#ffffff';
        if (dateEl) dateEl.style.color = '#8b949e';

        // Desátá funkce: Kód pro sledování webu

        if (localStorage.getItem('webSledovan') === 'true') {

        if (followBtn) {
            followBtn.addEventListener('click', () => {
                if (localStorage.getItem('webSledovan') === 'true') {
                    localStorage.setItem('webSledovan', 'false');
                    followBtn.innerText = '🔔 Sledovat';

        function nastavStavSledovano() {
            if (followBtn) {
                followBtn.innerText = '✓ Sledováno';
                followBtn.classList.add('active');
            }
        }

        function aktivovatSystemoveNotifikace() {
            if ('Notification' in window) {

            iframe.src = src + '&m=' + model;
        }

    const slozky = [];
    for (let i = 1; i <= 206; i++) {
        let nazevSlozky = 'fotka' + i;
        
        let info = detailyFotak[nazevSlozky] || {
            popisek: 'Pozorování oblohy #' + i,
        };
        
        slozky.push({
            nazev: nazevSlozky,
            popisek: info.popisek,
            autor: info.autor,
        });
    }

    // Seřazení složek od největšího čísla po nejmenší (fotka33, fotka32...)
    slozky.sort((a, b) => {
        let cisloA = parseInt(a.nazev.replace(/\D/g, '')) || 0;
        let cisloB = parseInt(b.nazev.replace(/\D/g, '')) || 0;
        return cisloB - cisloA;
    });

    const fotekNaStranu = 12;
    const urlParams = new URLSearchParams(window.location.search);
    let aktualniStrana = parseInt(urlParams.get('strana')) || 1;

    const celkemFotek = slozky.length;
    const celkemStran = Math.ceil(celkemFotek / fotekNaStranu);

    if (aktualniStrana < 1) aktualniStrana = 1;
    if (aktualniStrana > celkemStran && celkemStran > 0) aktualniStrana = celkemStran;

    const start = (aktualniStrana - 1) * fotekNaStranu;
    const aktualniSlozky = slozky.slice(start, start + fotekNaStranu);

    // Generování mřížky s fotkami a čistým textem pod nimi
    let gridHtml = '';
    if (aktualniSlozky.length === 0) {
        gridHtml = '<p style="color: #fff;">Žádné fotky tu nejsou.</p>';
    } else {
        aktualniSlozky.forEach(polozka => {
            let cisloMatch = polozka.nazev.match(/\d+/);
            let cislo = cisloMatch ? cisloMatch[0] : '';
            let cestaObrazku = './' + polozka.nazev + '/moje-foto' + cislo + '.jpg';

            gridHtml += `
            <a href="./${polozka.nazev}/" style="text-decoration: none; color: inherit; text-align: left;">

                    <div style="font-size: 0.75rem; color: #8b949e; margin-top: 4px;">Autor: ${polozka.autor} </div>
                </div>
            </a>`;
        });
    }
    document.getElementById('galerie-grid').innerHTML = gridHtml;

    // Generování stránkování dole (modrá aktivní stránka, čitelná čísla)
    let paginationHtml = '';
    if (celkemStran > 1) {
        for (let i = 1; i <= celkemStran; i++) {
            let aktivniStyl = (i === aktualniStrana) 
                ? 'background: #007bff; color: #fff; font-weight: bold;' 
                : 'background: #fff; color: #333;';
                
            paginationHtml += `<a href="?strana=${i}" style="display: inline-block; padding: 10px 15px; margin: 0 5px; border: 1px solid #ccc; text-decoration: none; border-radius: 5px; ${aktivniStyl}">${i}</a>`;
        }
    }
    document.getElementById('strankovani').innerHTML = paginationHtml;
</script>

<script>
  // Po kliknutí na hamburger / křížek přepne třídu .open na #main-header
  document.getElementById('main-header').addEventListener('click', function(e) {
    // Zjistíme, jestli uživatel kliknul v pravé části (kde je hamburger / křížek)
    const rect = this.getBoundingClientRect();
    const clickX = e.clientX - rect.left;
    
    // Pokud klikne do pravých cca 60 pixelů (kde bývá tlačítko ☰), otevře/zavře menu
    if (clickX > rect.width - 70) {
      this.classList.toggle('open');
    }
  });
</script>
